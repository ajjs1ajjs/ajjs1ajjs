name: Check Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Lychee CLI
        run: bash ./.github/scripts/install-lychee.sh

      - name: Check markdown links
        run: |
          set +e
          lychee --verbose --no-progress \
            --max-retries 2 --retry-wait-time 2 --timeout 20 \
            --format markdown --output "$RUNNER_TEMP/lychee-summary.md" \
            './README.md' './AUDIT_REPORT.md'
          result=$?
          set -e
          if [[ -f "$RUNNER_TEMP/lychee-summary.md" ]]; then
            cat "$RUNNER_TEMP/lychee-summary.md"
            cat "$RUNNER_TEMP/lychee-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
