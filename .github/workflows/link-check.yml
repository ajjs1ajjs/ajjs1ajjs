name: Check Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Lychee CLI
        run: bash ./.github/scripts/install-lychee.sh

      - name: Check markdown links
        run: |
          set +e
          lychee --verbose --no-progress --format markdown './README.md' > "$RUNNER_TEMP/lychee.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/lychee.log"
          cat "$RUNNER_TEMP/lychee.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
